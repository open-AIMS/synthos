#https://github.com/henryspatialanalysis/mbg/blob/main/_pkgdown.yml

url: https://open-aims.github.io/synthos/
template:
  bootstrap: 5
  bootswatch: simplex
  theme: arrow-light
  math-rendering: katex
  bslib:
    base_font: {google: "Figtree"}
    heading_font: {google: "Figtree"}
    bg: '#ffffff'
    fg: '#171717'
    primary: '#F36E21'
    secondary: '#058040'
  includes:
    in_header:
      - '<link rel="icon" type="image/png" href="synthos_logo_2.png">'
navbar:
  title: mbg
  structure:
    left: [home, intro, vignettes]
    right: [search, reference, github]
  components:
    home:
      text: Home
      href: index.html
    vignettes:
      text: More tutorials
      menu:
      - text: Generate spatio-temporal domain
        href: articles/geographical_domain.html
      - text: Generate disturbances
        href: articles/generate_disturbances.html
      - text: Generate baselines
        href: articles/generate_baselines.html
      - text: Generate sampling design
        href: articles/generate_sampling_design.html
