#https://github.com/henryspatialanalysis/mbg/blob/main/_pkgdown.yml

url: https://open-aims.github.io/synthos/
template:
  bootstrap: 5
  bootswatch: flatly   # best neutral base for earth themes
  bslib:
    primary: "#8C6746"      # Earth brown (main brand)
    secondary: "#C2A878"    # Sandstone beige
    success: "#6B8E77"      # Sage green
    info: "#D6C38A"         # Pale sand
    warning: "#A5682A"      # Terracotta
    danger: "#8C6746"       # Subtle brown
    light: "#FAF8F4"        # Light sand
    dark: "#3A2F2A"         # Bark / deep earth

    # Typography for a clean, natural modern feel
    base_font: {google: "Inter"}
    heading_font: {google: "Source Serif Pro"}
    code_font: {google: "Fira Code"}
